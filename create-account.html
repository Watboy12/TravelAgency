<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' https://fonts.googleapis.com; img-src 'self' data: https://via.placeholder.com https://*.tile.openstreetmap.org; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://jsonplaceholder.typicode.com;">
  <title>Create Account — ExploreWorld</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles-enhanced.css">
</head>
<body>

<div id="page-loader">
  <div class="loader-logo">ExploreWorld</div>
  <div class="loader-bar"><div class="loader-bar-fill"></div></div>
</div>

<nav id="main-nav">
  <div class="logo"><a href="index.html"><img src="images/logo.png" alt="ExploreWorld" class="header-logo"></a></div>
  <div class="nav-container">
    <ul class="nav-links"></ul>
    <div class="hamburger" aria-label="Toggle navigation"><span></span><span></span><span></span></div>
  </div>
</nav>

<section class="register-page">
  <div class="register-container">
    <div class="register-left">
      <img src="images/create-account-image.jpg" alt="Join ExploreWorld" class="register-image" onerror="this.style.display='none'">
      <div class="register-writeup">
        <h2>Join ExploreWorld</h2>
        <p>Create your account to start planning extraordinary vacations. Enjoy exclusive bonuses and manage your bookings with ease.</p>
        <p>Already have an account? <a href="login.html">Sign in →</a></p>
      </div>
    </div>
    <div class="register-right">
      <div style="margin-bottom:8px;">
        <span style="font-family:'Space Mono',monospace;font-size:0.68rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold);">New Account</span>
      </div>
      <h2>Create Account</h2>
      <form id="create-account-form">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Your full name" required>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Choose a username" required>
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required>
        <label for="phone">Phone Number <span class="info-icon" title="Used for trip communications">ⓘ</span></label>
        <input type="tel" id="phone" name="phone" placeholder="+1 555 123 4567" required>
        <label for="address">Home Address <span class="info-icon" title="Used to find nearest airport">ⓘ</span></label>
        <input type="text" id="address" name="address" placeholder="Your full address" required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Min. 8 chars, upper, lower, number" required>
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Repeat your password" required>
        <button type="submit" class="btn btn-primary" style="margin-top:4px;"><span id="account-spinner" class="spinner" style="display:none;"></span> Create Account</button>
        <p id="error-message" class="error-message hidden"></p>
      </form>
    </div>
  </div>
</section>

<div id="notifications"></div>
<script>
  window.addEventListener('load', () => {
    setTimeout(() => document.getElementById('page-loader')?.classList.add('hidden'), 1800);
  });
  window.addEventListener('scroll', () => {
    document.getElementById('main-nav')?.classList.toggle('scrolled', window.scrollY > 40);
  });
</script>
<script src="script.js"></script>
</body>
</html>
